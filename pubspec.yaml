name: ai_order_assistant
description: "AI-assisted order capture and debt tracking for small family shops."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_image_compress: ^2.4.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  go_router: ^14.2.0
  json_annotation: ^4.9.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  riverpod_annotation: ^3.0.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
